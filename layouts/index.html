{{ define "main" }}
<!-- 最上部のヘッダー（端から端まで広げる） -->
<div class="header-logo-area">
  <div class="header-content">
    <div class="header-logo">
      <img src="/images/logo.png" alt="会社マーク" class="logo-img">
    </div>
    <div class="header-company-name">
      <h1>(有)小園自動車商会</h1>
    </div>
  </div>
</div>

<!-- 全体にまとめるコンテナ -->
<div class="homepage1-container">

  <!-- 写真のスライドショーエリア -->
  <div class="slideshow-container">
    <div class="slide fade"><img src="/images/1000019565.jpg" alt="スタッフ募集中"></div>
    <div class="slide fade"><img src="/images/photo2.jpg" alt="新車・中古車販売"></div>
    <div class="slide fade"><img src="/images/photo3.jpg" alt="店舗外観"></div>
  </div>

  <!-- お知らせ欄（青枠＆スクロール） -->
  <div class="news-box">
    <h3>お知らせ</h3>
    <div class="news-scroll-content">
      <div class="news-item">
        <div class="news-text">
          <span style="color: #666; font-size: 13px;">2026.08.01</span><br>
          現在中東情勢により部品が入りづらくなっています。<br><br>
          <span style="color: #666; font-size: 13px;">2026.08.01</span><br>
          ホームページを開設しました。車検や整備の際はお気軽にお問い合わせください。
        </div>
      </div>
    </div>
  </div>

  <br><br>

  <!-- 下部の店舗情報 -->
  <div class="shop-info">
    {{ .Content }}
  </div>

  <br><br>

  <!-- 営業日カレンダー -->
  <div class="calendar-box">
    <h3>営業日カレンダー</h3>
    <div class="calendar-header-nav">
      <button onclick="changeMonth(-1)" class="cal-btn">＜</button>
      <span id="calendar-title" style="font-weight: bold; font-size: 16px; color: #333;">2026年 8月 営業日</span>
      <button onclick="changeMonth(1)" class="cal-btn">＞</button>
    </div>
    <div class="calendar-table-wrapper" style="margin-top: 10px;">
      <table class="calendar-table">
        <thead>
          <tr>
            <th class="sun">日</th>
            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th class="sat">土</th>
          </tr>
        </thead>
        <tbody id="calendar-body">
          <!-- JavaScriptで動的にカレンダーが生成されます -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- デザイン（CSS）の設定 -->
<style>
  .homepage1-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    font-family: sans-serif;
  }

  .header-logo-area {
    background-color: #004080;
    padding: 15px 20px;
    margin-bottom: 20px;
    width: 100%;
    box-sizing: border-box;
  }

  .header-content {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    max-width: 1000px;
    margin: 0 auto;
  }

  .header-logo {
    margin-right: 20px;
  }

  .logo-img {
    height: 50px;
    width: auto;
    display: block;
  }

  .header-company-name h1 {
    margin: 0;
    color: #ffffff;
    font-size: 24px;
  }

  .slideshow-container {
    position: relative;
    max-width: 100%;
    height: 350px;
    margin: 0 auto 30px auto;
    overflow: hidden;
    border-radius: 8px;
    background-color: #ddd;
  }

  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .fade {
    animation-name: fade;
    animation-duration: 3s;
  }

  @keyframes fade {
    from {opacity: .4}
    to {opacity: 1}
  }

  .news-box {
    border: 2px solid #004080;
    background-color: #ffffff;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: left;
  }

  .news-box h3 {
    margin-top: 0;
    color: #004080;
    font-size: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .news-scroll-content {
    max-height: 150px;
    overflow-y: auto;
    padding-right: 15px;
    margin-top: 10px;
  }

  .news-item {
    margin-bottom: 15px;
    padding: 0 5px;
  }

  .news-text {
    margin: 0;
    font-size: 15px;
    color: #333333;
    line-height: 1.6;
  }

  .shop-info {
    text-align: center;
    line-height: 1.6;
  }

  .calendar-box {
    border: 2px solid #004080;
    background-color: #ffffff;
    border-radius: 8px;
    padding: 20px;
    margin-top: 30px;
    text-align: left;
  }

  .calendar-box h3 {
    margin-top: 0;
    color: #004080;
    font-size: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .calendar-header-nav {
    text-align: center;
    margin-bottom: 10px;
  }

  .cal-btn {
    background-color: #f0f4f8;
    border: 1px solid #ddd;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 4px;
    margin: 0 10px;
  }

  .cal-btn:hover {
    background-color: #e2e8f0;
  }

  .calendar-table {
    width: 100%;
    max-width: 450px;
    margin: 0 auto;
    border-collapse: collapse;
    background-color: #fff;
  }

  .calendar-table th, .calendar-table td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    font-size: 13px;
    vertical-align: middle;
    height: 45px;
  }

  .calendar-table th {
    background-color: #f0f4f8;
    color: #333;
  }

  .calendar-table th.sun, .calendar-table td.sun {
    color: #d9534f;
  }

  .calendar-table th.sat, .calendar-table td.sat {
    color: #333333;
  }

  .cal-day-num {
    font-weight: bold;
    display: block;
  }

  .cal-holiday-text {
    font-size: 10px;
    color: #d9534f;
    display: block;
    margin-top: 2px;
  }
</style>

<!-- スライドショー＆カレンダー制御スクリプト -->
<script>
  let slideIndex = 0;
  showSlides();

  function showSlides() {
    let slides = document.getElementsByClassName("slide");
    for (let i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";  
    }
    slideIndex++;
    if (slideIndex > slides.length) {slideIndex = 1}    
    if (slides.length > 0) {
      slides[slideIndex-1].style.display = "block";  
      setTimeout(showSlides, 7000);  //スライド時間
    }
  }

  let today = new Date();
  let currentYear = today.getFullYear();
  let currentMonth = today.getMonth();

  // ▼【お盆休みや臨時の定休日を追加する場所】
  // "YYYY-MM-DD" の形式で、お休みしたい日付をここに書き足してください。
  const customHolidays = [
    "2026-08-13", // お盆休み初日
    "2026-08-14", // お盆休み中日
    "2026-08-15", // お盆休み最終日
    "2026-09-21", // 敬老の日
    "2026-09-22", // 国民の日
    "2026-09-23" // 秋分の日
  ];

  function renderCalendar(year, month) {
    const titleElem = document.getElementById("calendar-title");
    const bodyElem = document.getElementById("calendar-body");
    
    titleElem.innerText = `${year}年 ${month + 1}月 営業日`;
    bodyElem.innerHTML = "";

    let firstDay = new Date(year, month, 1).getDay();
    let lastDate = new Date(year, month + 1, 0).getDate();

    let date = 1;
    let html = "";

    for (let i = 0; i < 6; i++) {
      let rowHtml = "<tr>";
      let hasDay = false;

      for (let j = 0; j < 7; j++) {
        if (i === 0 && j < firstDay) {
          rowHtml += "<td></td>";
        } else if (date > lastDate) {
          rowHtml += "<td></td>";
        } else {
          hasDay = true;
          let isSun = (j === 0);

          // 日付を "YYYY-MM-DD" の形式に組み立てます
          let mm = String(month + 1).padStart(2, '0');
          let dd = String(date).padStart(2, '0');
          let dateStr = `${year}-${mm}-${dd}`;

          // 日曜日、または個別に登録したお休み（お盆など）なら定休日とする
          let isHoliday = isSun || customHolidays.includes(dateStr);

          let tdClass = "";
          if (isSun) tdClass = "sun";
          else if (j === 6) tdClass = "sat";

          // 個別のお休みの日（お盆など）も日曜日と同様に赤文字にする場合
          if (customHolidays.includes(dateStr) && !isSun) {
            tdClass = "sun";
          }

          rowHtml += `<td class="${tdClass}">`;
          rowHtml += `<span class="cal-day-num">${date}</span>`;
          if (isHoliday) {
            rowHtml += `<span class="cal-holiday-text">定休日</span>`;
          }
          rowHtml += `</td>`;
          date++;
        }
      }
      rowHtml += "</tr>";
      if (hasDay) {
        html += rowHtml;
      }
    }
    bodyElem.innerHTML = html;
  }

  function changeMonth(direction) {
    currentMonth += direction;
    if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    } else if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    }
    renderCalendar(currentYear, currentMonth);
  }

  renderCalendar(currentYear, currentMonth);
</script>
{{ end }}
