{{ define "main" }}
<!-- 全体にまとめるコンテナ -->
<div class="homepage1-container">

  <!-- 1. 最上部のヘッダー（会社ロゴ＆会社名） -->
  <div class="header-logo-area">
    <div class="header-content">
      <div class="header-logo">
        <img src="/images/logo.png" alt="会社マーク" class="logo-img">
      </div>
      <div class="header-company-name">
        <h1>(有)小園自動車商会</h1>
      </div>
    </div>
  </div>

  <!-- 2. 写真のスライドショーエリア -->
  <div class="slideshow-container">
    <div class="slide fade"><img src="/images/1000019519.jpg" alt="スタッフ募集中"></div>
    <div class="slide fade"><img src="/images/photo2.jpg" alt="新車・中古車販売"></div>
    <div class="slide fade"><img src="/images/photo3.jpg" alt="店舗外観"></div>
  </div>

  <!-- 3. お知らせ欄（青枠で囲み、posts/index.md などの内容をスクロール表示） -->
  <div class="news-box">
    <h3>お知らせ</h3>
    <div class="news-scroll-content">
      <div class="news-item">
        <!-- 下記の `.Site.GetPage` で別ファイルの文章をここに呼び出します -->
        {{ $newsPage := .Site.GetPage "/posts/index.md" }}
        {{ if $newsPage }}
          <div class="news-text">{{ $newsPage.Content }}</div>
        {{ else }}
          <p class="news-text">お知らせはありません。</p>
        {{ end }}
      </div>
    </div>
  </div>

  <br><br>

  <!-- 4. 下部の店舗情報 -->
  <div class="shop-info">
    {{ .Content }}
  </div>

</div>

<!-- デザイン（CSS）の設定 -->
<style>
  /* 全体のスタイル */
  .homepage1-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    font-family: sans-serif;
  }

  /* 1. ヘッダー */
  .header-logo-area {
    background-color: #004080;
    padding: 15px 20px;
    margin-bottom: 20px;
    border-radius: 8px;
  }

  .header-content {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .header-logo {
    margin-right: 20px;
  }

  .logo-img {
    height: 50px;
    width: auto;
    display: block;
  }

  .header-company-name h1 {
    margin: 0;
    color: #ffffff;
    font-size: 24px;
  }

  /* 2. スライドショー */
  .slideshow-container {
    position: relative;
    max-width: 100%;
    height: 350px;
    margin: 0 auto 30px auto;
    overflow: hidden;
    border-radius: 8px;
    background-color: #ddd;
  }

  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .fade {
    animation-name: fade;
    animation-duration: 3s;
  }

  @keyframes fade {
    from {opacity: .4}
    to {opacity: 1}
  }

  /* 3. お知らせボックス（青枠＆スクロール） */
  .news-box {
    border: 2px solid #004080;
    background-color: #ffffff;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: left;
  }

  .news-box h3 {
    margin-top: 0;
    color: #004080;
    font-size: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .news-scroll-content {
    max-height: 150px; /* スクロールする高さの制限 */
    overflow-y: auto; /* 縦スクロール */
    padding-right: 15px;
    margin-top: 10px;
  }

  .news-item {
    margin-bottom: 15px;
    padding: 0 5px;
  }

  .news-text {
    margin: 0;
    font-size: 15px;
    color: #333333;
    line-height: 1.5;
  }

  /* 4. 下部の店舗情報エリア */
  .shop-info {
    text-align: center;
    line-height: 1.6;
  }
</style>

<!-- スライドショーの自動切り替えスクリプト -->
<script>
  let slideIndex = 0;
  showSlides();

  function showSlides() {
    let slides = document.getElementsByClassName("slide");
    for (let i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";  
    }
    slideIndex++;
    if (slideIndex > slides.length) {slideIndex = 1}    
    if (slides.length > 0) {
      slides[slideIndex-1].style.display = "block";  
      setTimeout(showSlides, 4000);
    }
  }
</script>
{{ end }}
