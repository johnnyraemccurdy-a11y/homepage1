{{ define "main" }}
<!-- 全体にまとめるコンテナ -->
<div class="homepage1-container">

  <!-- 1. 会社ロゴ＆マーク付きタイトルエリア -->
  <div class="header-logo-area">
    <div class="header-content">
      <div class="header-logo">
        <img src="/images/logo.png" alt="会社マーク" class="logo-img">
      </div>
      <div class="header-company-name">
        <h1>(有)小園自動車商会</h1>
      </div>
    </div>
  </div>

  <!-- 2. 写真のスライドショー（ここに写真を復活させました） -->
  <div class="slideshow-container">
    <div class="slide fade"><img src="/images/1000019519.jpg" alt="スタッフ募集中"></div>
    <div class="slide fade"><img src="/images/photo2.jpg" alt="新車・中古車販売"></div>
    <div class="slide fade"><img src="/images/photo3.jpg" alt="店舗外観"></div>
  </div>

  <!-- 3. お知らせエリア（ここに自由なお知らせ文言をスクロール表示） -->
  <div class="news-box">
    <h3>お知らせ</h3>
    <div class="news-scroll-content">
      <div class="news-item">
        <!-- ここに直接お知らせ文言を書くか、自由に変更できます -->
        <span class="news-date">2026.08.01</span>
        <p class="news-text">ホームページを開設しました。車検や整備のご予約はお気軽にお問い合わせください。</p>
      </div>
    </div>
  </div>

  <br><br>

  <!-- 4. 本文コンテンツ（店舗情報や募集要項：中央寄せに設定） -->
  <div class="shop-info">
    {{ .Content }}
  </div>

</div>

<!-- デザイン（CSS）の設定 -->
<style>
  /* 全体のスタイル（幅を広めに調整） */
  .homepage1-container {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
    font-family: sans-serif;
  }

  /* 1. ヘッダー（ロゴと会社名） */
  .header-logo-area {
    background-color: #004080;
    padding: 15px 20px;
    margin-bottom: 20px;
    border-radius: 8px;
  }

  .header-content {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .header-logo {
    margin-right: 20px;
  }

  .logo-img {
    height: 50px;
    width: auto;
    display: block;
  }

  .header-company-name h1 {
    margin: 0;
    color: #ffffff;
    font-size: 24px;
  }

  /* 2. スライドショー（サイズをしっかり確保） */
  .slideshow-container {
    position: relative;
    max-width: 100%;
    height: 400px;
    margin: 0 auto 30px auto;
    overflow: hidden;
    border-radius: 8px;
    background-color: #ddd;
  }

  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* 4. ショップ情報（中央寄せに修正） */
  .shop-info {
    text-align: center; /* 全体を中央寄せにします */
    line-height: 1.6;
  }
  
  /* 募集要項などの見出しやテキストも綺麗に中央に配置されるように調整 */
  .shop-info h2, .shop-info h3 {
    color: #333;
    margin-top: 20px;
  }
</style>

<!-- スライドショーの自動切り替えスクリプト -->
<script>
  let slideIndex = 0;
  showSlides();

  function showSlides() {
    let slides = document.getElementsByClassName("slide");
    for (let i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";  
    }
    slideIndex++;
    if (slideIndex > slides.length) {slideIndex = 1}    
    if (slides.length > 0) {
      slides[slideIndex-1].style.display = "block";  
      setTimeout(showSlides, 4000);
    }
  }
</script>
{{ end }}
