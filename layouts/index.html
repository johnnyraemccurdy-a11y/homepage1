{{ define "main" }}
<!-- 最上部のヘッダー（端から端まで広げる部分） -->
<div class="header-logo-area">
  <div class="header-content">
    <div class="header-logo">
      <img src="/images/logo.png" alt="会社マーク" class="logo-img">
    </div>
    <div class="header-company-name">
      <h1>(有)小園自動車商会</h1>
    </div>
  </div>
</div>

<!-- 全体にまとめるコンテナ -->
<div class="homepage1-container">

  <!-- 写真のスライドショーエリア -->
  <div class="slideshow-container">
    <div class="slide fade"><img src="/images/1000019519.jpg" alt="スタッフ募集中"></div>
    <div class="slide fade"><img src="/images/photo2.jpg" alt="新車・中古車販売"></div>
    <div class="slide fade"><img src="/images/photo3.jpg" alt="店舗外観"></div>
  </div>

  <!-- お知らせ欄（青枠＆スクロール） -->
  <div class="news-box">
    <h3>お知らせ</h3>
    <div class="news-scroll-content">
      <div class="news-item">
        {{ $newsPage := .Site.GetPage "posts/index.md" }}
        {{ if $newsPage }}
          <div class="news-text">{{ $newsPage.Content }}</div>
        {{ else }}
          <p class="news-text">お知らせはありません。</p>
        {{ end }}
      </div>
    </div>
  </div>

  <br><br>

  <!-- 下部の店舗情報 -->
  <div class="shop-info">
    {{ .Content }}
  </div>

  <br><br>

  <!-- 一番下に追加した営業日カレンダーエリア -->
  <div class="calendar-box">
    <h3>営業日カレンダー</h3>
    <div class="calendar-table-wrapper">
      <table class="calendar-table">
        <caption>2026年 8月 営業日</caption>
        <thead>
          <tr>
            <th class="sun">日</th>
            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th class="sat">土</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td><td></td><td></td><td></td><td>1</td><td>2</td><td class="sat">3</td>
          </tr>
          <tr>
            <td class="sun">4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td><td class="sat">10</td>
          </tr>
          <tr>
            <td class="sun">11</td><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td class="sat">17</td>
          </tr>
          <tr>
            <td class="sun">18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td class="sat">24</td>
          </tr>
          <tr>
            <td class="sun">25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td><td class="sat">31</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- デザイン（CSS）の設定 -->
<style>
  /* 全体のスタイル */
  .homepage1-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    font-family: sans-serif;
  }

  /* 最上部ヘッダー（端から端まで広げる） */
  .header-logo-area {
    background-color: #004080;
    padding: 15px 20px;
    margin-bottom: 20px;
    width: 100%;
    box-sizing: border-box;
  }

  .header-content {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    max-width: 1000px;
    margin: 0 auto;
  }

  .header-logo {
    margin-right: 20px;
  }

  .logo-img {
    height: 50px;
    width: auto;
    display: block;
  }

  .header-company-name h1 {
    margin: 0;
    color: #ffffff;
    font-size: 24px;
  }

  /* スライドショー */
  .slideshow-container {
    position: relative;
    max-width: 100%;
    height: 350px;
    margin: 0 auto 30px auto;
    overflow: hidden;
    border-radius: 8px;
    background-color: #ddd;
  }

  .slide {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .fade {
    animation-name: fade;
    animation-duration: 3s;
  }

  @keyframes fade {
    from {opacity: .4}
    to {opacity: 1}
  }

  /* お知らせボックス（青枠＆スクロール） */
  .news-box {
    border: 2px solid #004080;
    background-color: #ffffff;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 30px;
    text-align: left;
  }

  .news-box h3 {
    margin-top: 0;
    color: #004080;
    font-size: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .news-scroll-content {
    max-height: 150px;
    overflow-y: auto;
    padding-right: 15px;
    margin-top: 10px;
  }

  .news-item {
    margin-bottom: 15px;
    padding: 0 5px;
  }

  .news-text {
    margin: 0;
    font-size: 15px;
    color: #333333;
    line-height: 1.5;
  }

  /* 下部の店舗情報（元のレイアウトを維持） */
  .shop-info {
    text-align: center;
    line-height: 1.6;
  }

  /* 一番下に追加したカレンダーのデザイン */
  .calendar-box {
    border: 2px solid #004080;
    background-color: #ffffff;
    border-radius: 8px;
    padding: 20px;
    margin-top: 30px;
    text-align: left;
  }

  .calendar-box h3 {
    margin-top: 0;
    color: #004080;
    font-size: 18px;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
  }

  .calendar-table {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    border-collapse: collapse;
    background-color: #fff;
  }

  .calendar-table caption {
    font-weight: bold;
    margin-bottom: 10px;
    color: #333;
    font-size: 16px;
  }

  .calendar-table th, .calendar-table td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
    font-size: 14px;
  }

  .calendar-table th {
    background-color: #f0f4f8;
    color: #333;
  }

  .calendar-table th.sun, .calendar-table td.sun {
    color: #d9534f;
  }

  .calendar-table th.sat, .calendar-table td.sat {
    color: #0275d8;
  }
</style>

<!-- スライドショーの自動切り替えスクリプト -->
<script>
  let slideIndex = 0;
  showSlides();

  function showSlides() {
    let slides = document.getElementsByClassName("slide");
    for (let i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";  
    }
    slideIndex++;
    if (slideIndex > slides.length) {slideIndex = 1}    
    if (slides.length > 0) {
      slides[slideIndex-1].style.display = "block";  
      setTimeout(showSlides, 4000);
    }
  }
</script>
{{ end }}
